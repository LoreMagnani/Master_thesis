name: Compila e Sincronizza su Drive

on:
  push:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repo
        uses: actions/checkout@v4

      - name: Compila il documento LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Carica su Google Drive
        uses: adrive/drive-upload-action@v1
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          filename: main.pdf
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          overwrite: true