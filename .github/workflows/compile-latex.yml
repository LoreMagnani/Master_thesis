name: Compila e Sincronizza su Drive

on:
  push:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repo
        uses: actions/checkout@v4

      - name: Compila il documento LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Carica su Google Drive
        uses: Jms6/google-drive-upload-action@v1.2.1
        with:
          gdrive-credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent-folder-id: ${{ secrets.GDRIVE_FOLDER_ID }}
          filename: main.pdf
          name: main.pdf
          overwrite: true