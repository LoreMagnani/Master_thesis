name: Compila e Sincronizza su Drive

on:
  push:
    branches: [ "main" ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal repo
        uses: actions/checkout@v4

      - name: Compila il documento LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Carica su Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'EOF'
          import os
          import requests

          client_id = os.environ.get("GDRIVE_CLIENT_ID")
          client_secret = os.environ.get("GDRIVE_CLIENT_SECRET")
          refresh_token = os.environ.get("GDRIVE_REFRESH_TOKEN")
          folder_id = os.environ.get("GDRIVE_FOLDER_ID")

          # 1. Ottieni un nuovo Access Token usando il Refresh Token
          token_url = "https://oauth2.googleapis.com/token"
          token_data = {
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token"
          }
          r = requests.post(token_url, data=token_data)
          token_json = r.json()
          access_token = token_json.get("access_token")

          if not access_token:
              print("Errore durante l'aggiornamento del token:", r.text)
              exit(1)

          headers = {"Authorization": f"Bearer {access_token}"}
          file_path = 'main.pdf'
          file_name = 'main.pdf'

          # 2. Cerca se il file esiste già nella cartella
          query = f"'{folder_id}' in parents and name = '{file_name}' and trashed = false"
          r = requests.get(
              "https://www.googleapis.com/drive/v3/files",
              headers=headers,
              params={"q": query}
          )
          files = r.json().get('files', [])

          metadata = {
              'name': file_name,
              'parents': [folder_id]
          }

          files_data = {
              'data': ('metadata', str(metadata).replace("'", '"'), 'application/json'),
              'file': ('media', open(file_path, 'rb'), 'application/pdf')
          }

          # 3. Aggiorna o crea il file sfruttando il tuo spazio personale
          if files:
              file_id = files[0]['id']
              print(f"Aggiornamento file esistente su Google Drive (ID: {file_id})...")
              response = requests.patch(
                  f"https://www.googleapis.com/upload/drive/v3/files/{file_id}?uploadType=multipart",
                  headers=headers,
                  files=files_data
              )
          else:
              print("Creazione nuovo file su Google Drive...")
              response = requests.post(
                  "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
                  headers=headers,
                  files=files_data
              )

          print("Risposta Google Drive:", response.status_code, response.text)
          if response.status_code not in [200, 201]:
              exit(1)
          EOF